<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before paint to avoid a light flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("profit-pilot-theme") || "system";
          var isDark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark", "dark-mode");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
    <!-- resizes-visual: Android Chrome shrinks visualViewport with the keyboard so chat composer stays above it -->

  <body>
    <!-- Splash Screen - Shows immediately while app loads -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <!-- Logo -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 32px;">
        <img 
          src="/logo.png" 
          alt="Trippo Logo" 
          style="height: 64px; width: 64px; object-fit: contain; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"
        />
        <span id="splash-brand-text" style="font-size: 24px; font-weight: 400; color: #374151; text-transform: lowercase; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
          trippo
        </span>
      </div>

      <!-- Loading GIF -->
      <img
        src="/loading.gif"
        alt="Loading"
        style="height: 72px; width: 72px; object-fit: contain;"
        onerror="this.style.display='none';"
      />
    </div>

    <style>
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      @media (max-width: 1023px) {
        #splash-brand-text {
          display: none;
        }
      }
    </style>

    <div id="root"></div>
    <script>
      // Failsafe: dismiss splash even if React fails to mount
      (function () {
        function dismissSplash() {
          var splash = document.getElementById("splash-screen");
          var root = document.getElementById("root");
          if (root) root.classList.add("loaded");
          document.body.classList.add("loaded");
          if (!splash) return;
          splash.style.transition = "opacity 0.2s ease-out";
          splash.style.opacity = "0";
          setTimeout(function () {
            splash.remove();
          }, 200);
        }
        setTimeout(dismissSplash, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Prevent layout shift by setting initial styles -->
    <style>
      /* Prevent layout shift on initial load */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      
      #root {
        min-height: 100vh;
        width: 100%;
      }
      
      /* Prevent flash of unstyled content - keep body fixed to prevent scroll bounce */
      body {
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      body.loaded {
        overflow: auto;
        position: relative;
        height: auto;
      }
      
      /* Hide root until React is ready - no transition to prevent bounce */
      #root {
        opacity: 0;
      }
      
      #root.loaded {
        opacity: 1;
        transition: opacity 0.15s ease-in;
      }
      
      /* Prevent any layout shifts */
      * {
        box-sizing: border-box;
      }
    </style>
  </body>
</html>
